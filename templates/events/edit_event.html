<div class="modal-body">
    <form action="/editar-evento" method="post">

        <input type="hidden" name="evento_id" value="{{evento[0]}}">

        <div class="row g-3">

            <div class="col-12">
                <div class="form-floating">
                    <input type="text" class="form-control" name="nome" value="{{evento[2]}}" required>
                    <label>Nome</label>
                </div>
            </div>

            <div class="col-12">
                <div class="form-floating">
                    <input type="text" class="form-control" name="local" value="{{evento[3]}}" required>
                    <label>Local</label>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-floating">
                    <input type="date" class="form-control" name="data" value="{{evento[4]}}" required>
                    <label>Data</label>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-floating">
                    <input type="time" class="form-control" name="hora" value="{{evento[5]}}" required>
                    <label>Hora</label>
                </div>
            </div>

            <div class="col-12">
                <div class="form-floating">
                    <input type="number" class="form-control" name="limite" value="{{evento[6]}}"
                        required>
                    <label>Limite de convidados</label>
                </div>
            </div>

        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-secundario-dark" data-bs-dismiss="modal">
                Cancelar
            </button>
            <button class="btn btn-evento" type="submit">
                Salvar evento
            </button>
        </div>

    </form>
</div>

<script>
// Usamos um seletor mais específico ou pegamos pelo ID
const formEditar = document.querySelector('form[action="/editar-evento"]');

if (formEditar) {
    formEditar.addEventListener("submit", function (e) {
        // Buscamos os inputs DENTRO deste formulário específico
        const nome = this.querySelector('input[name="nome"]').value.trim();
        const local = this.querySelector('input[name="local"]').value.trim();
        const data = this.querySelector('input[name="data"]').value;
        const hora = this.querySelector('input[name="hora"]').value;
        const limite = parseInt(this.querySelector('input[name="limite"]').value);

        if (nome.length === 0 || nome.length > 20) {
            alert("O nome do evento deve ter entre 1 e 20 caracteres.");
            e.preventDefault();
            return;
        }

        if (!data || !hora) {
            alert("Informe a data e hora do evento.");
            e.preventDefault();
            return;
        }

        // Validação de data retroativa
        const dataHoraEvento = new Date(`${data}T${hora}`);
        const agora = new Date();

        if (dataHoraEvento <= agora) {
            alert("O evento não pode ser editado para um horário passado.");
            e.preventDefault();
            return;
        }

        if (isNaN(limite) || limite < 1 || limite > 1000) {
            alert("O limite de convidados deve estar entre 1 e 1000.");
            e.preventDefault();
            return;
        }
    });
}
</script>
